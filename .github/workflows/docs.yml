name: Docs

# Checks that relative links and heading anchors in Markdown files resolve.
# External URLs are skipped (--offline).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true
